services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - TZ=Asia/Karachi
      - SQLITE_DB_PATH=/app/data/dotboys.db
    volumes:
      - hostel_data:/app/data
      - hostel_uploads:/app/uploads
    restart: unless-stopped

volumes:
  hostel_data:
  hostel_uploads:
